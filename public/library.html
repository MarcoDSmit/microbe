<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Card library · Microbe Wars</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/library.css">
  <script type="module" src="/preferences.js"></script>
  <script type="module" src="/library.js"></script>
</head>
<body>
  <header class="masthead">
    <a class="brand" href="/">Microbe Wars</a>
    <nav class="utility" aria-label="Game resources"><a href="/">Back to game</a><a href="/rules.html">Rules</a><a id="atlas" target="_blank" rel="noopener">Pathogen Universe</a></nav>
  </header>
  <main class="library">
    <h1>Card library</h1>
    <div class="library-controls">
      <label>Search cards <input id="search" type="search" placeholder="Name, card ID or ability"></label>
      <label>Card group <select id="group"><option value="">Both decks</option><option>Bacteria</option><option>Host</option><option>Site</option><option>Objective</option></select></label>
    </div>
    <details>
      <summary>Pathogen Universe connection</summary>
      <p>Start your local atlas, or enter the address of a hosted copy.</p>
      <form id="atlas-form"><label>Atlas address <input id="atlas-address" type="url" required></label> <button class="secondary">Save</button></form>
      <p id="atlas-status" role="status"></p>
    </details>
    <p id="count" role="status"></p>
    <div id="cards" class="library-cards"></div>
    <section aria-labelledby="retired-heading" id="retired-section">
      <h2 id="retired-heading">Retired cards</h2>
      <p>Archived playtest designs and their replacements.</p>
      <p id="retired-empty" hidden>No retired cards match this filter.</p>
      <div id="retired-cards" class="library-cards"></div>
    </section>
    <dialog id="card-inspector" aria-label="Enlarged card">
      <button id="close-inspector" class="secondary" type="button" autofocus>Close</button>
      <div id="inspected-card"></div>
    </dialog>
    <noscript>Enable JavaScript to browse the cards.</noscript>
  </main>
</body>
</html>
