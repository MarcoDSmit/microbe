<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A two-player Microbe Wars v3 playtest with invite-only matches.">
  <meta name="theme-color" content="#f5f2e9">
  <title>Microbe Wars Online</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/preferences.js"></script>
  <script type="module" src="/client.js"></script>
</head>
<body>
  <header class="masthead">
    <a class="brand" href="/"><span class="brand-mark" aria-hidden="true">✳</span><span>Microbe Wars</span></a>
    <nav class="utility" aria-label="Game help and settings">
      <details class="reference-menu">
        <summary>Menu</summary>
        <div class="panel">
          <a id="library-link" href="/library.html" target="_blank" rel="noopener"><img src="/button-art/library.webp" alt="Card library" width="854" height="270"></a>
          <a href="/rules.html#setup" target="_blank" rel="noopener"><img src="/button-art/rules.webp" alt="Rules" width="854" height="270"></a>
          <a href="/rules.html#glossary" target="_blank" rel="noopener"><img src="/button-art/glossary.webp" alt="Glossary" width="854" height="270"></a>
          <a href="/tutorial.html" target="_blank" rel="noopener"><img src="/button-art/tutorial.webp" alt="Tutorial" width="854" height="270"></a>
          <a href="https://github.com/MarcoDSmit/microbe/issues/new?title=Playtest%20bug&amp;body=Game%20mode%3A%0ATurn%20and%20cards%20involved%3A%0ASteps%20to%20reproduce%3A%0AExpected%20result%3A%0AActual%20result%3A%0A%0AThis%20report%20is%20public.%20Leave%20out%20invite%20links%20and%20personal%20information." target="_blank" rel="noopener"><img src="/button-art/report-a-bug.webp" alt="Report a bug" width="854" height="270"></a>
        </div>
      </details>
      <details class="settings">
        <summary>Settings</summary>
        <div class="panel">
          <label><input id="night-mode" type="checkbox" role="switch"> Night mode</label>
          <label for="text-size">Text size <output id="text-value" for="text-size">100%</output></label>
          <input id="text-size" type="range" min="90" max="150" step="5" value="100">
          <label><input id="menu-music" type="checkbox" role="switch" checked> Music and ambience</label>
          <label><input id="sound-effects" type="checkbox" role="switch" checked> Sound effects and voice cues</label>
        </div>
      </details>
    </nav>
  </header>
  <main id="app"><p class="loading">Opening the field lab…</p></main>
  <noscript>Enable JavaScript to enter a match.</noscript>
</body>
</html>
